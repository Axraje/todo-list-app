<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/tareas.css">
    <title>Lista de Tareas</title>
</head>
<body>

    <header class="header">
        <img class="header__fondo" src="img/fondo.jpg" alt="Imagen de fondo de la lista de tareas">
    </header>

    <main class="main">
        <section class="section">
            <div class="titulo"> <h1 class="titulo__principal">Lista de Tareas</h1></div>
            <div class="tareas">
                <form class="formulario" id="formulario">
                    <h2>Asignacion</h2>
                    <div class="campo">
                        <label class="campo__label" for="tarea">Agregar Tarea:</label>
                        <textarea class="campo__textarea"  name="tarea" id="tarea" placeholder="Ingresa una Tarea" ></textarea>
                    </div>
                    <div class="campo">
                            <input type="submit" value="Enviar" class="boton">
                    </div>
                </form>

                <div class="lista">
                    <h2>Tareas Asignadas</h2>
                </div>

            </div>
        </section>
    </main>
    <footer class="footer"> <div class="pie"><p>Axel Alvarez 2027 </p></div></footer>
    <script src="js/tareas.js"> </script>
</body>
</html>
