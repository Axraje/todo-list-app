<main class="main">

      <header class="titulo"> <h1>Lista de Tareas</h1></header>
      <div class="contenido-tareas">
          <form class="formulario" id="formulario">
            <h2>Asignacion</h2>
            <div class="campo">
              <label class="campo__label" for="tarea">Agregar Tarea:</label>
              <textarea class="campo__textarea" name="tarea" id="tarea" placeholder="Ingresa una Tarea"></textarea>
            </div>
            <div class="campo">
              <input type="submit" value="Enviar" class="boton">
            </div>
          </form>

          <div class="lista">
            <h2>Tareas Asignadas</h2>
